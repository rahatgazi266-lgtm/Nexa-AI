name: Nexa AI Android Release APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Git tag to attach the APK to (e.g. v2.0.0)'
        required: false
        default: 'v2.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing KEYSTORE_BASE64 repository secret'; exit 1; }
          mkdir -p "$RUNNER_TEMP/nexa-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexa-signing/upload-key.jks"
          test -s "$RUNNER_TEMP/nexa-signing/upload-key.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/nexa-signing/upload-key.jks" >> "$GITHUB_ENV"

      - name: Create runtime secrets file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY="%s"\n' "$GEMINI_API_KEY" > .env
          else
            echo 'GEMINI_API_KEY is not configured; app will build without a packaged Gemini key.'
          fi

      - name: Build release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || { echo 'Missing STORE_PASSWORD repository secret'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing KEY_PASSWORD repository secret'; exit 1; }
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease

      - name: Verify APK package ID and signing certificate
        env:
          EXPECTED_PACKAGE_ID: com.aistudio.nexaai.hqzjtr
          EXPECTED_CERT_SHA256: ${{ secrets.EXPECTED_CERT_SHA256 }}
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK" || { echo 'Release APK missing'; exit 1; }
          APKANALYZER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/apkanalyzer"
          if [ ! -x "$APKANALYZER" ]; then APKANALYZER="$(find "$ANDROID_SDK_ROOT" -name apkanalyzer -type f | head -1)"; fi
          ACTUAL_PACKAGE="$($APKANALYZER manifest application-id "$APK")"
          [ "$ACTUAL_PACKAGE" = "$EXPECTED_PACKAGE_ID" ] || { echo "Package ID mismatch: $ACTUAL_PACKAGE"; exit 1; }
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          ACTUAL_CERT="$(sed -n 's/.*Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/apk-signature.txt" | head -1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          test -n "$ACTUAL_CERT" || { echo 'Could not read APK signing certificate'; exit 1; }
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            EXPECTED_CERT="$(printf '%s' "$EXPECTED_CERT_SHA256" | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
            [ "$ACTUAL_CERT" = "$EXPECTED_CERT" ] || { echo 'Signing certificate SHA-256 mismatch'; exit 1; }
          else
            echo 'EXPECTED_CERT_SHA256 is not set. APK signature is structurally verified, but certificate pinning comparison is skipped.'
          fi
          sha256sum "$APK" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-AI-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          gh release upload "$RELEASE_TAG" app/build/outputs/apk/release/app-release.apk --clobber
